<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Honeypot Dashboard{% endblock %}</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="nav-icon">&#128737;</span>
            Honeypot Security
        </div>
        <div class="nav-links">
            <a href="/" class="{% if request.endpoint == 'index' %}active{% endif %}">
                <span class="nav-link-icon">&#128200;</span>
                Dashboard
            </a>
            <a href="/attacks" class="{% if request.endpoint == 'attacks' %}active{% endif %}">
                <span class="nav-link-icon">&#9889;</span>
                Attacks
            </a>
            <a href="/commands" class="{% if request.endpoint == 'commands' %}active{% endif %}">
                <span class="nav-link-icon">&#128187;</span>
                Commands
            </a>
            <a href="/credentials" class="{% if request.endpoint == 'credentials' %}active{% endif %}">
                <span class="nav-link-icon">&#128273;</span>
                Credentials
            </a>
            <a href="/ips" class="{% if request.endpoint == 'ips' %}active{% endif %}">
                <span class="nav-link-icon">&#127760;</span>
                IPs
            </a>
            <a href="/sessions" class="{% if request.endpoint == 'sessions' %}active{% endif %}">
                <span class="nav-link-icon">&#128065;</span>
                Sessions
            </a>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <input type="text" id="global-search" placeholder="Search..." onkeyup="handleSearch(event)">
            </div>
            <div class="nav-status">
                <span id="status-indicator" class="status-online"></span>
                <span id="last-update">Updating...</span>
            </div>
        </div>
    </nav>

    <!-- Search Results Modal -->
    <div id="search-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Search Results</h3>
                <button class="modal-close" onclick="closeSearchModal()">&times;</button>
            </div>
            <div class="modal-body" id="search-results">
                <!-- Results will be loaded here -->
            </div>
        </div>
    </div>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Honeypot Security System &copy; 2024 | Raspberry Pi</p>
    </footer>

    <!-- Charts JS -->
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>

    <script>
        // Global search functionality
        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('global-search').value;
                if (query.length >= 2) {
                    performSearch(query);
                }
            }
        }

        async function performSearch(query) {
            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                const modal = document.getElementById('search-modal');
                const results = document.getElementById('search-results');

                if (data.results.length === 0) {
                    results.innerHTML = '<p class="no-results">No results found for "' + escapeHtml(query) + '"</p>';
                } else {
                    let html = `<p class="result-count">Found ${data.count} results for "${escapeHtml(query)}"</p>`;
                    html += '<table class="attacks-table"><thead><tr><th>Time</th><th>Source</th><th>IP</th><th>Username</th><th>Command</th></tr></thead><tbody>';

                    data.results.forEach(r => {
                        const time = new Date(r.timestamp).toLocaleString();
                        html += `<tr>
                            <td>${time}</td>
                            <td><span class="source-badge ${r.source.toLowerCase()}">${r.source}</span></td>
                            <td class="ip-cell">${r.ip_address}</td>
                            <td>${r.username || '-'}</td>
                            <td class="command-cell">${escapeHtml(r.command || '-')}</td>
                        </tr>`;
                    });

                    html += '</tbody></table>';
                    results.innerHTML = html;
                }

                modal.style.display = 'flex';
            } catch (error) {
                console.error('Search error:', error);
            }
        }

        function closeSearchModal() {
            document.getElementById('search-modal').style.display = 'none';
        }

        // Close modal on outside click
        document.getElementById('search-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeSearchModal();
            }
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
